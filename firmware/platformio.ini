; ESP32-S3 macropad — layout JSON from Next.js API, LVGL UI
[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

build_flags =
    -D BOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -D ARDUINO_USB_MODE=0
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D MACRO_PAD_HEADLESS=1
    -D LV_CONF_INCLUDE_SIMPLE
    -D LV_LVGL_H_INCLUDE_SIMPLE
    -D LV_FONT_MONTSERRAT_12=1
    -D LV_FONT_MONTSERRAT_14=1
    -D LV_FONT_MONTSERRAT_28=1
    -I include

board_build.filesystem = littlefs
board_build.partitions = default_8MB.csv

lib_deps =
    lvgl/lvgl @ ~8.3.11
    lovyan03/LovyanGFX @ ^1.1.12
    bblanchon/ArduinoJson @ ^7.0.4
    bodmer/TJpg_Decoder @ ^1.0.8
    links2004/WebSockets @ ^2.4.1

; Hardware build — panel + touch + USB HID (edit pins in board_config.h)
[env:esp32s3_hw]
extends = env:esp32s3
build_flags =
    -D BOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D MACRO_PAD_HEADLESS=0
    -D LV_CONF_INCLUDE_SIMPLE
    -D LV_LVGL_H_INCLUDE_SIMPLE
    -D LV_FONT_MONTSERRAT_12=1
    -D LV_FONT_MONTSERRAT_14=1
    -D LV_FONT_MONTSERRAT_28=1
    -I include

; ESP32-P4 Function EV Board + 7" 1024x600 MIPI-DSI + GT911 touch
[env:esp32p4_hw]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = esp32-p4-evboard
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
board_build.partitions = default_16MB.csv
board_build.embed_files = certs/x509_crt_bundle

build_flags =
    -D BOARD_HAS_PSRAM
    -D ARDUINO_USB_MODE=0
    -D ARDUINO_USB_CDC_ON_BOOT=0
    -D MACRO_PAD_HEADLESS=0
    -D MACRO_PAD_ENABLE_USB_HID=0
    -D MACRO_PAD_USE_ESP_PANEL=1
    -D ESP_PANEL_BOARD_DEFAULT_USE_SUPPORTED=0
    -D ESP_PANEL_BOARD_DEFAULT_USE_CUSTOM=1
    -D LV_CONF_INCLUDE_SIMPLE
    -D LV_LVGL_H_INCLUDE_SIMPLE
    -D LV_COLOR_16_SWAP=0
    -D LV_FONT_MONTSERRAT_12=1
    -D LV_FONT_MONTSERRAT_14=1
    -D LV_FONT_MONTSERRAT_28=1
    -I include

lib_ignore =
    Wire

lib_deps =
    lvgl/lvgl @ ~8.3.11
    https://github.com/esp-arduino-libs/ESP32_Display_Panel.git
    https://github.com/esp-arduino-libs/ESP32_IO_Expander.git#v1.1.0
    https://github.com/esp-arduino-libs/esp-lib-utils.git#v0.2.0
    bblanchon/ArduinoJson @ ^7.0.4
    links2004/WebSockets @ ^2.4.1

; Public binaries never embed a developer's local secrets.h.
[env:esp32p4_release]
extends = env:esp32p4_hw
build_flags =
    ${env:esp32p4_hw.build_flags}
    -D MACROPAD_PUBLIC_BUILD=1
